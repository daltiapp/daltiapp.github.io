<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>대회 일정 | Agility Korea</title>
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.hero{background:#172033;color:#fff;padding:34px 20px}.hero-inner,.wrap{max-width:1100px;margin:auto}.eyebrow{color:#9fb9ff;font-size:13px;font-weight:700;letter-spacing:.08em}.hero h1{margin:8px 0 6px;font-size:clamp(26px,5vw,42px)}.hero p{margin:0;color:#c8d0df}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:22px 0}.toolbar input,.toolbar select{border:1px solid #d8deea;background:#fff;border-radius:10px;padding:11px 13px;font:inherit}.toolbar input{flex:1;min-width:220px}.summary{font-size:14px;color:#667085;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px;padding-bottom:34px}.card{background:#fff;border:1px solid #e5e9f1;border-radius:16px;padding:18px;box-shadow:0 5px 18px #1720330b}.date{font-size:13px;color:#4969c8;font-weight:700}.card h2{font-size:19px;line-height:1.4;margin:8px 0 12px}.line{margin:7px 0;color:#566176;font-size:14px}.line b{color:#172033}.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px}.tag{background:#eef2ff;color:#405bb0;border-radius:999px;padding:5px 9px;font-size:12px}.card a{display:inline-block;margin-top:14px;color:#3158c7;font-weight:700;text-decoration:none}.empty,.error{background:#fff;border:1px dashed #ccd4e3;border-radius:14px;padding:24px;text-align:center;color:#667085}.error{color:#a33b3b}.foot{padding:0 0 28px;color:#8a94a6;font-size:12px}@media(max-width:520px){.hero{padding:28px 16px}.wrap{padding:0 16px}.toolbar{padding-top:16px}}
  </style>
</head>
<body>
  <header class="hero"><div class="hero-inner"><div class="eyebrow">AGILITY KOREA</div><h1>대회 일정</h1><p id="version">최신 일정 불러오는 중…</p></div></header>
  <main class="wrap">
    <div class="toolbar"><input id="search" type="search" placeholder="대회명·장소·클럽 검색"><select id="type"><option value="">전체 유형</option><option>대회</option><option>승급전</option><option>랭킹전</option></select><select id="period"><option value="upcoming">예정 일정</option><option value="all">전체 일정</option></select></div>
    <p id="summary" class="summary"></p><section id="events" class="grid" aria-live="polite"></section><p class="foot">데이터 출처: agilitykorea-manifest.json · 활성 데이터 경로를 자동으로 사용합니다.</p>
  </main>
  <script>
    const $=id=>document.getElementById(id);let events=[];
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const fmt=(value,withTime=true)=>{if(!value)return'-';const d=new Date(value);if(Number.isNaN(d.getTime()))return value;return d.toLocaleString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit',...(withTime?{hour:'2-digit',minute:'2-digit'}:{})})};
    function render(){const q=$('search').value.trim().toLowerCase(),type=$('type').value,up=$('period').value==='upcoming',now=Date.now();const list=events.filter(e=>(!up||new Date(e.endAt||e.startAt).getTime()>=now)&&(!type||e.eventType===type)&&(!q||[e.name,e.location,e.club,e.eventChair,e.eventType].join(' ').toLowerCase().includes(q)));$('summary').textContent=`${list.length}개 일정 · ${events.length}개 전체`;if(!list.length){$('events').innerHTML='<div class="empty">조건에 맞는 일정이 없습니다.</div>';return}$('events').innerHTML=list.map(e=>`<article class="card"><div class="date">${esc(fmt(e.startAt,false))}</div><h2>${esc(e.name)}</h2><p class="line"><b>시간</b> ${esc(fmt(e.startAt))} ~ ${esc(fmt(e.endAt))}</p><p class="line"><b>장소</b> ${esc(e.location||'미정')}</p><p class="line"><b>대회장</b> ${esc(e.eventChair||'미정')}</p><p class="line"><b>유형</b> ${esc(e.eventType||'미정')} · <b>주최</b> ${esc(e.club||'미정')}</p><div class="tags">${(e.matchTypes||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>${e.url?`<a href="${esc(e.url)}" target="_blank" rel="noopener">상세 공지 열기 →</a>`:''}</article>`).join('')}
    async function load(){try{const manifest=await fetch('agilitykorea-manifest.json').then(r=>{if(!r.ok)throw Error('manifest');return r.json()});const base=manifest.basePath.replace(/\/$/,'/');const path=base+manifest.files.match;const payload=await fetch(path).then(r=>{if(!r.ok)throw Error('match');return r.json()});events=payload.competitions||[];$('version').textContent=`${manifest.dataVersion} · ${events.length}개 일정`;render()}catch(e){$('version').textContent='데이터를 불러오지 못했습니다';$('events').innerHTML='<div class="error">활성 일정 JSON을 불러오지 못했습니다. 웹 서버에서 다시 열어주세요.</div>'}}
    ['search','type','period'].forEach(id=>$(id).addEventListener('input',render));load();
  </script>
</body>
</html>
